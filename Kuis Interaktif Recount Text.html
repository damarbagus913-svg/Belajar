<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif: Recount Text SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0fdf4; }
        .option-label { transition: all 0.2s ease-in-out; }
        .option-label:hover { background-color: #e0f2fe; }
        input[type="radio"]:checked + span { font-weight: bold; color: #1d4ed8; }
        .correct-answer { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .explanation { display: none; }
        .show-explanation { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-10 mb-8 border-t-8 border-green-500">
            <h1 class="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-4">Latihan Soal Recount Text</h1>
            <p class="text-center text-gray-500 mb-6">Pilih satu jawaban yang paling tepat. Anda dapat mengubah pilihan sebelum menekan tombol Selesai.</p>
            
            <div id="quiz-container" class="space-y-12">
                <!-- Konten kuis akan di-render di sini oleh JavaScript -->
            </div>

            <div class="mt-12 text-center">
                <button id="submit-btn" class="bg-green-600 hover:bg-green-700 text-white px-10 py-4 rounded-xl font-bold text-lg shadow-md transition transform hover:scale-105">Selesai & Cek Skor</button>
            </div>
        </div>

        <div id="result-container" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center border-t-8 border-blue-500 fixed bottom-0 left-0 right-0 md:relative md:bottom-auto z-50">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Skor Akhir Anda</h2>
            <div class="flex justify-center items-end gap-2 mb-4">
                <span id="score-display" class="text-6xl font-black text-blue-600">0</span>
                <span class="text-2xl text-gray-500 mb-1">/ 31</span>
            </div>
            <p id="score-message" class="text-lg text-gray-600 mb-6"></p>
            <button id="retry-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-8 py-3 rounded-xl font-semibold transition">Ulangi Kuis</button>
            <button id="review-btn" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-8 py-3 rounded-xl font-semibold transition ml-4">Lihat Pembahasan</button>
        </div>
    </div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-xl max-w-md w-full text-center">
            <h3 class="text-xl font-bold mb-4 text-red-600">Perhatian!</h3>
            <p id="confirm-message" class="text-gray-700 mb-6">Anda belum menjawab semua pertanyaan.</p>
            <div class="flex justify-center gap-4">
                <button id="cancel-submit" class="px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 font-semibold transition">Batal</button>
                <button id="proceed-submit" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold transition">Kumpulkan Saja</button>
            </div>
        </div>
    </div>

        const quizContainer = document.getElementById('quiz-container');
        const submitBtn = document.getElementById('submit-btn');
        const resultContainer = document.getElementById('result-container');
        const scoreDisplay = document.getElementById('score-display');
        const scoreMessage = document.getElementById('score-message');
        const retryBtn = document.getElementById('retry-btn');
        const reviewBtn = document.getElementById('review-btn');
        
        // Elemen Modal
        const confirmModal = document.getElementById('confirm-modal');
        const confirmMessage = document.getElementById('confirm-message');
        const cancelSubmitBtn = document.getElementById('cancel-submit');
        const proceedSubmitBtn = document.getElementById('proceed-submit');

        function renderQuiz() {
            quizContainer.innerHTML = '';
            quizData.forEach((section) => {
                // Buat Box untuk Teks Bacaan
                const textSection = document.createElement('div');
                textSection.className = 'bg-gray-50 border border-gray-200 rounded-xl p-5 md:p-8 mb-6';
                textSection.innerHTML = `
                    <div class="inline-block bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-md mb-4">${section.title}</div>
                    <div class="text-gray-700 leading-relaxed text-justify">${section.content}</div>
                `;
                quizContainer.appendChild(textSection);

                // Buat Pertanyaan dan Pilihan Ganda
                section.questions.forEach((q) => {
                    const questionBox = document.createElement('div');
                    questionBox.className = 'bg-white border-2 border-gray-100 rounded-xl p-5 md:p-6 mb-6 shadow-sm question-item';
                    questionBox.dataset.id = q.id;
                    questionBox.dataset.answer = q.answer;

                    let optionsHtml = '';
                    const labels = ['A', 'B', 'C', 'D'];
                    q.options.forEach((opt, optIndex) => {
                        optionsHtml += `
                            <label class="option-label flex items-start p-3 border border-gray-200 rounded-lg cursor-pointer mb-2 relative">
                                <input type="radio" name="q${q.id}" value="${optIndex}" class="mt-1 h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                                <span class="ml-3 text-gray-700"><span class="font-semibold mr-2">${labels[optIndex]}.</span> ${opt}</span>
                            </label>
                        `;
                    });

                    questionBox.innerHTML = `
                        <h3 class="text-lg font-semibold text-gray-800 mb-4"><span class="text-blue-600 mr-1">${q.id}.</span> ${q.q}</h3>
                        <div class="options-container space-y-2">
                            ${optionsHtml}
                        </div>
                        <div class="explanation mt-4 p-4 bg-yellow-50 border-l-4 border-yellow-400 text-yellow-800 rounded-r-lg text-sm">
                            <strong>Pembahasan:</strong> ${q.exp}
                        </div>
                    `;
                    quizContainer.appendChild(questionBox);
                });
            });
        }

        function calculateScore() {
            let score = 0;
            const questionItems = document.querySelectorAll('.question-item');
            
            questionItems.forEach(item => {
                const qId = item.dataset.id;
                const correctAnswer = parseInt(item.dataset.answer);
                const options = item.querySelectorAll('label');
                const selectedInput = document.querySelector(`input[name="q${qId}"]:checked`);
                const explanation = item.querySelector('.explanation');
                
                // Nonaktifkan semua radio button agar tidak bisa diubah lagi
                const allInputs = item.querySelectorAll('input[type="radio"]');
                allInputs.forEach(input => input.disabled = true);
                
                // Reset styling kelas hijau/merah di setiap percobaan ulang
                options.forEach(opt => {
                    opt.classList.remove('correct-answer', 'wrong-answer');
                });

                if (selectedInput) {
                    const selectedValue = parseInt(selectedInput.value);
                    if (selectedValue === correctAnswer) {
                        score++;
                        options[selectedValue].classList.add('correct-answer');
                    } else {
                        options[selectedValue].classList.add('wrong-answer');
                        options[correctAnswer].classList.add('correct-answer');
                    }
                } else {
                    // Jika tidak dijawab, tandai jawaban yang benar saja
                    options[correctAnswer].classList.add('correct-answer');
                }
                
                // Tampilkan pembahasan
                explanation.classList.add('show-explanation');
            });

            scoreDisplay.textContent = score;
            if(score === 31) {
                scoreMessage.textContent = "Sempurna! Anda menguasai materi dengan sangat baik.";
            } else if (score >= 20) {
                scoreMessage.textContent = "Kerja bagus! Anda sudah memahami sebagian besar materi.";
            } else {
                scoreMessage.textContent = "Jangan menyerah! Pelajari lagi pembahasannya dan coba lagi.";
            }
            
            submitBtn.style.display = 'none';
            resultContainer.classList.remove('hidden');
        }

        function resetQuiz() {
            renderQuiz();
            submitBtn.style.display = 'inline-block';
            resultContainer.classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Logic Tombol Submit dengan Custom Modal
        submitBtn.addEventListener('click', () => {
            const totalAnswered = document.querySelectorAll('input[type="radio"]:checked').length;
            if (totalAnswered < 31) {
                confirmMessage.textContent = `Anda baru menjawab ${totalAnswered} dari 31 soal. Yakin ingin mengumpulkan sekarang?`;
                confirmModal.classList.remove('hidden');
            } else {
                calculateScore();
            }
        });
        
        cancelSubmitBtn.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
        });
        
        proceedSubmitBtn.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            calculateScore();
        });

        retryBtn.addEventListener('click', resetQuiz);
        reviewBtn.addEventListener('click', () => {
             document.getElementById('result-container').classList.add('md:relative', 'md:bottom-auto');
             document.getElementById('result-container').classList.remove('fixed', 'bottom-0');
             window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Merender kuis pertama kali saat halaman dimuat
        renderQuiz();
    </script>
</body>
</html>
